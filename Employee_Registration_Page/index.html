<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>Employee Registration</h1>

            <p>Fill in the details below to register a new employee.</p>

        </div>

        <form>

            <div class="form-grid">

                <div class="form-group">
                    <label for="employeeId">Employee ID</label>
                    <input type="text" id="employeeId" placeholder="Enter employee ID">
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number">
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department">

                        <option>Select Department</option>
                        <option>Human Resources</option>
                        <option>Finance</option>
                        <option>Sales</option>
                        <option>Marketing</option>
                        <option>Information Technology</option>

                    </select>

                </div>

                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" placeholder="Enter designation">
                </div>

                <div class="form-group">
                    <label for="joiningDate">Date of Joining</label>
                    <input type="date" id="joiningDate">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password">
                </div>

                <div class="button-group">

                    <button type="submit" class="register-btn">
                        Register
                    </button>

                    <button type="reset" class="reset-btn">
                        Reset
                    </button>

                </div>

            </div>

        </form>

    </div>

</body>

</html>
