<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneCloud Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->

        <div class="left-panel">

            <div class="logo">
                <i class="fa-solid fa-cloud"></i>
                <h1>OneCloud</h1>
            </div>

            <h2>Welcome Back!</h2>

            <p>
                Login to access HRMS, Payroll, CRM, Finance,
                Analytics and all enterprise modules.
            </p>

            <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=1000"
                alt="Enterprise">

        </div>

        <!-- Right Section -->

        <div class="right-panel">

            <form id="loginForm">

                <h2>Employee Login</h2>

                <div class="input-box">

                    <label>Employee ID / Email</label>

                    <input type="text"
                        id="username"
                        placeholder="Enter Employee ID">

                </div>

                <div class="input-box">

                    <label>Password</label>

                    <input type="password"
                        id="password"
                        placeholder="Enter Password">

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
