<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Management | OneCloud</title>

    <link rel="stylesheet" href="css/hr-common.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >
</head>

<body>

<header class="topbar">

    <a href="hr-dashboard.html" class="brand">
        <i class="fa-solid fa-cloud"></i>
        <span>OneCloud</span>
    </a>

    <nav>
        <a href="hr-dashboard.html">HR Dashboard</a>

        <a
            href="leave-management.html"
            class="active"
        >
            Apply Leave
        </a>

        <a href="leave-approval.html">
            Leave Approval
        </a>

        <a href="employee-profile.html">
            Profile
        </a>
    </nav>

</header>


<main class="shell">

    <section class="hero">

        <div>
            <span class="eyebrow">
                LEAVE MODULE
            </span>

            <h1>Employee Leave Request</h1>

            <p>
                Submit employee leave requests and automatically
                calculate the total number of leave days.
            </p>
        </div>

    </section>


    <section class="card form-card">

        <div class="section-heading">

            <div>
                <span class="eyebrow">
                    REQUEST FORM
                </span>

                <h2>Apply for Leave</h2>
            </div>

            <div class="heading-icon">
                <i class="fa-solid fa-calendar-plus"></i>
            </div>

        </div>


        <form id="leaveForm">

            <div class="form-grid">

                <!-- Employee ID -->

                <div class="field">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <select
                        id="employeeId"
                        required
                    >
                        <option value="">
                            Select Employee
                        </option>
                    </select>

                </div>


                <!-- Employee Name -->

                <div class="field">

                    <label for="employeeName">
                        Employee Name
                    </label>

                    <input
                        type="text"
                        id="employeeName"
                        readonly
                        required
                    >

                </div>


                <!-- Department -->

                <div class="field">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        readonly
                        required
                    >

                </div>


                <!-- Leave Type -->

                <div class="field">

                    <label for="leaveType">
                        Leave Type
                    </label>

                    <select
                        id="leaveType"
                        required
                    >

                        <option value="">
                            Select Leave Type
                        </option>

                        <option value="Casual Leave">
                            Casual Leave
                        </option>

                        <option value="Sick Leave">
                            Sick Leave
                        </option>

                        <option value="Earned Leave">
                            Earned Leave
                        </option>

                        <option value="Maternity Leave">
                            Maternity Leave
                        </option>

                    </select>

                </div>


                <!-- From Date -->

                <div class="field">

                    <label for="fromDate">
                        From Date
                    </label>

                    <input
                        type="date"
                        id="fromDate"
                        required
                    >

                </div>


                <!-- To Date -->

                <div class="field">

                    <label for="toDate">
                        To Date
                    </label>

                    <input
                        type="date"
                        id="toDate"
                        required
                    >

                </div>


                <!-- Total Days -->

                <div class="field">

                    <label for="totalDays">
                        Total Leave Days
                    </label>

                    <input
                        type="number"
                        id="totalDays"
                        value="0"
                        readonly
                    >

                </div>


                <!-- Reason -->

                <div class="field full">

                    <label for="reason">
                        Reason
                    </label>

                    <textarea
                        id="reason"
                        placeholder="Enter reason for requesting leave..."
                        required
                    ></textarea>

                </div>

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn primary"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                    Apply Leave
                </button>

                <button
                    type="reset"
                    class="btn secondary"
                    id="resetButton"
                >
                    <i class="fa-solid fa-rotate-left"></i>
                    Reset
                </button>

            </div>

            <div
                id="message"
                class="message"
                role="alert"
            ></div>

        </form>

    </section>

</main>


<script src="js/hr-data.js"></script>
<script src="js/leave-management.js"></script>

</body>
</html>
